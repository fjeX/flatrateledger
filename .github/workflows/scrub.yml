name: Scrub check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit author emails are checked too
      - name: No private details in any tracked file
        env:
          SCRUB_DENYLIST: ${{ secrets.SCRUB_DENYLIST }}
        run: scripts/scrub-check.sh --all
